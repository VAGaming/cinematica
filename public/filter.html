<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bộ lọc</title>
    <link rel="icon" type="image/x-icon" href="./logo-icon.svg" />
    <link rel="stylesheet" href="css/filter.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/search.css" />
  </head>

  <body>
    <header class="main-header">
      <div class="container">
        <div class="header-logo">
          <a href="./index.html" style="display: flex; align-items: center">
            <img src="./logo-icon.svg" alt="logo" />
            <img
              class="logo-text"
              src="./images/absolutecinema.svg"
              alt="absolutecinema"
            />
          </a>
        </div>
        <nav class="nav-menu">
          <a href="./index.html">Trang chủ</a>
          <a href="./filter.html" class="active">Thể loại</a>
        </nav>
        <div class="header-icons">
          <button class="header-icon">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
          <div class="user-menu">
            <button class="header-icon" id="userBtn" type="button">
              <i class="fa-regular fa-user"></i>
            </button>

            <div id="userDropdown" class="user-dropdown hidden">
              <div id="loggedOutView">
                <button id="loginBtn">Login</button>
                <button id="signupBtn">Sign Up</button>
              </div>

              <div id="loggedInView" class="hidden">
                <p id="userEmail"></p>
                <button id="logoutBtn">Logout</button>
              </div>
            </div>
          </div>

          <button class="header-icon">
            <i class="fa-regular fa-bell"></i>
          </button>
        </div>
      </div>
    </header>

    <div class="filter-controls">
      <select id="genre">
        <option value="">Thể loại</option>
      </select>
      <input id="year" type="number" placeholder="Năm" min="1881" max="2025" />
      <select id="country">
        <option value="">Quốc gia</option>
      </select>
    </div>

    <div id="movies" class="movies"></div>
    <div id="sentinel"></div>

    <div id="search-modal" class="modal">
      <div class="search-modal-content">
        <span class="close-search">&times;</span>
        <div class="search-box">
          <input
            type="text"
            id="search-input"
            placeholder="Nhập tên phim bạn muốn tìm......"
            autocomplete="off"
          />
          <button id="search-submit-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>
    </div>

    <script src="./js/search.js"></script>
    <script type="module" src="dropdown.js"></script>
    <script
      src="https://kit.fontawesome.com/801e0a2150.js"
      crossorigin="anonymous"
    ></script>
    <script src="js/filter.js"></script>
  </body>
</html>
